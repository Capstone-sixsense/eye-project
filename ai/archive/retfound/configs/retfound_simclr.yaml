project:
  version: retfound_simclr
  task: binary_dr_screening
  output_root: artifacts

model:
  architecture: retfound
  pretrained: false
  num_outputs: 1
  use_attention: false
  use_mixstyle: false

data:
  manifest_path: data/processed/manifest_preprocessed.csv
  image_root: data/raw
  image_size: 224
  num_workers: 4

train:
  seed: 42
  device: cuda
  amp: true
  pretrained_backbone_path: artifacts/RETFound/RETFound_mae_natureCFP.pth

ssl:
  epochs: 100
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  temperature: 0.07
  feature_dim: 1024
  proj_hidden_dim: 2048
  proj_out_dim: 128
  frozen_blocks: 16
  max_samples: 0
  early_stopping_patience: 5
  early_stopping_min_delta: 0.005

  output_path: artifacts/checkpoints/ssl/retfound_simclr.pth
