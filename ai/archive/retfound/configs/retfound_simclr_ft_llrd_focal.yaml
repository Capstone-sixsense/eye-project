project:
  version: retfound_simclr_ft_llrd_focal

model:
  architecture: retfound
  pretrained: false
  num_outputs: 1
  use_attention: false
  use_mixstyle: false
  grad_checkpointing: false
  classifier_dropout: 0.0

data:
  image_size: 224
  resize_size: 224

train:
  pretrained_backbone_path: artifacts/checkpoints/ssl/retfound_simclr.pth
  head_epochs: 3
  finetune_epochs: 30
  head_learning_rate: 0.001
  backbone_learning_rate: 0.00001
  min_checkpoint_sensitivity: 0.80
  loss: focal
  focal_alpha: 0.75
  focal_gamma: 0.0
  llrd_decay: 0.75
  early_stopping_patience: 5

infer:
  checkpoint_path: artifacts/checkpoints/retfound_simclr_ft_llrd_focal/best.pt
