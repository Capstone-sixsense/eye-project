project:
  version: v31_no_se_gated_safezoom_bbretrain_v1

data:
  manifest_path: data/processed/manifest_safezoom_preprocessed.csv
  image_root: data/raw
  preprocess_mode: safezoom
  target_short_fill: 0.86
  max_total_x_trim: 0.08
  max_total_y_trim: 0.08
  saliency_shift: true
  saliency_weight: 1.2
  saliency_candidates: 5
  safezoom_max_dim: 1024

model:
  architecture: efficientnet_b5
  use_attention: false
  attention_mode: none
  use_aux_seg: true
  aux_seg_block: 4
  aux_seg_channels: 1
  use_gated_pooling: true

train:
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  head_epochs: 0
  finetune_epochs: 15
  backbone_learning_rate: 0.00004
  lambda_aux_seg: 0.5
  seg_loss_type: dice_bce
  pretrained_backbone_path: artifacts/runs/03_resolution_layercam/v7_512_messidor_train_safezoom_v1/checkpoints/best.pt

infer:
  checkpoint_path: artifacts/runs/07_lesion_evidence/v31_no_se_gated_safezoom_bbretrain_v1/checkpoints/best.pt
  threshold: 0.37
  use_meta_classifier: false
  gradcam_method: layercam
  gradcam_target_block: 4
  evidence_type: cam_research
