project:
  version: v31_no_se_gated_quickqual_v1

data:
  manifest_path: data/processed/manifest_quickqual_with_val_mixed.csv
  image_root: data/raw
  preprocess_mode: quickqual
  val_split: val_mixed
  external_calibration_split: external_calibration

model:
  architecture: efficientnet_b5
  use_attention: false
  attention_mode: none
  use_aux_seg: true
  aux_seg_block: 4
  aux_seg_channels: 1
  use_gated_pooling: true

train:
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  head_epochs: 0
  finetune_epochs: 15
  backbone_learning_rate: 0.00004
  lambda_aux_seg: 0.5
  seg_loss_type: dice_bce
  selection_metric: external_calibration_auroc
  min_checkpoint_sensitivity: 0.0
  keep_last_n_checkpoints: 5
  pretrained_backbone_path: artifacts/runs/03_resolution_layercam/v7_512_messidor_train/checkpoints/best.pt

infer:
  checkpoint_path: artifacts/runs/99_misc/v31_no_se_gated_quickqual_v1/checkpoints/best.pt
  preprocess_mode: none
  threshold: 0.31
  use_meta_classifier: false
  gradcam_method: layercam
  gradcam_target_block: 4
  evidence_type: cam_research
