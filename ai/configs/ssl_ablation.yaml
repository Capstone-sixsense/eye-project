project:
  name: drscreen
  version: ssl_ablation_v1

# Experiment B: SSL pretraining on APTOS + IDRiD only (Messidor excluded).
# Compare resulting Messidor AUROC with ssl_v1 (which included Messidor) to
# determine whether v4 improvement is from SSL itself or domain exposure.
data:
  manifest_path: data/processed/manifest_ssl_ablation.csv
  image_root: data/raw
  num_workers: 4

model:
  use_attention: true

train:
  seed: 42
  device: cuda
  amp: true

ssl:
  use_preprocessing: false
  image_size: 224
  batch_size: 32
  epochs: 100
  learning_rate: 0.0003
  weight_decay: 0.0001
  temperature: 0.07
  projection_dim: 128
  checkpoint_interval: 10
  output_dir: artifacts/ssl_ablation
