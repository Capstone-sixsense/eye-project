project:
  version: v37_xai_multi_maples

# This config requires a preprocessed manifest that includes MAPLES-DR train rows.
# Build the raw manifest once with:
#   python -m drscreen.cli.build_manifest --include-messidor --messidor-as-train \
#     --include-ddr --include-maples \
#     --output data/processed/manifest_with_maples.csv
# Then regenerate the offline-preprocessed training manifest:
#   python preprocess_images.py --config configs/v37_xai_multi_maples.yaml \
#     --manifest data/processed/manifest_with_maples.csv \
#     --out-manifest data/processed/manifest_with_maples_preprocessed.csv
data:
  manifest_path: data/processed/manifest_with_maples_preprocessed.csv
  seg_mask_mode: composite
  # maples_annotations_dir defaults to data/raw/MAPLES-DR/AdditionalData/annotations
  # override here only if your MAPLES install lives elsewhere.

model:
  use_attention: false
  attention_mode: none
  use_aux_seg: true
  aux_seg_block: 4
  aux_seg_channels: 1
  decoder_type: unet
  decoder_blocks: [2, 3, 4]
  use_gated_pooling: false

train:
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  head_epochs: 0
  finetune_epochs: 15
  backbone_learning_rate: 0.00004
  lambda_aux_seg: 0.2
  lambda_cam_align: 0.1
  seg_loss_type: dice_bce
  pretrained_backbone_path: artifacts/runs/03_resolution_layercam/v7_512_messidor_train/checkpoints/best.pt

infer:
  checkpoint_path: artifacts/runs/08_xai_decoder_alignment/v37_xai_multi_maples/checkpoints/best.pt
  threshold: 0.35
  gradcam_method: layercam
  gradcam_target_block: 4
  evidence_type: cam_research
