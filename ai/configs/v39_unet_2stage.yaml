project:
  version: v39_unet_2stage

# Phase 4-D conditional fallback: freeze the v37b classifier path and train only
# the auxiliary U-Net decoder.
data:
  manifest_path: data/processed/manifest_with_maples_preprocessed.csv
  seg_mask_mode: composite

model:
  use_attention: false
  attention_mode: none
  use_aux_seg: true
  aux_seg_block: 4
  aux_seg_channels: 1
  decoder_type: unet
  decoder_blocks: [2, 3, 4]
  use_gated_pooling: false

train:
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  head_epochs: 0
  finetune_epochs: 10
  backbone_learning_rate: 0.0
  head_learning_rate: 0.0002
  lambda_aux_seg: 0.4
  lambda_cam_align: 0.0
  seg_loss_type: dice_bce
  training_mode: decoder_only
  pretrained_backbone_path: artifacts/runs/08_xai_decoder_alignment/v37b_xai_unet_only/checkpoints/best.pt

infer:
  checkpoint_path: artifacts/runs/08_xai_decoder_alignment/v39_unet_2stage/checkpoints/best.pt
  threshold: 0.27
  gradcam_method: layercam
  gradcam_target_block: 4
  evidence_type: cam_research
