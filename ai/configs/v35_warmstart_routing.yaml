project:
  version: v35_warmstart_routing

data:
  seg_mask_mode: per_lesion
  seg_mask_channels: 4

model:
  use_attention: false
  attention_mode: none
  use_aux_seg: true
  aux_seg_block: 4
  aux_seg_channels: 4
  use_gated_pooling: true

train:
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  head_epochs: 3
  finetune_epochs: 15
  backbone_learning_rate: 0.00002
  lambda_aux_seg: 0.3
  seg_loss_type: dice_bce
  pretrained_backbone_path: artifacts/runs/07_lesion_evidence/v31_no_se_gated/checkpoints/best.pt

infer:
  checkpoint_path: artifacts/runs/07_lesion_evidence/v35_warmstart_routing/checkpoints/best.pt
  threshold: 0.35
  gradcam_method: layercam
  gradcam_target_block: 4
  evidence_type: lesion_segmentation
  lesion_threshold: 0.5
