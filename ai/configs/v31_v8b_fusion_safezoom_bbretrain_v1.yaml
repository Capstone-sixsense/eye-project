project:
  version: v31_v8b_fusion_safezoom_bbretrain_v1
  task: binary_dr_screening
  output_root: artifacts

data:
  manifest_path: data/processed/manifest_safezoom_preprocessed.csv
  image_root: data/raw
  preprocess_mode: safezoom
  target_short_fill: 0.86
  max_total_x_trim: 0.08
  max_total_y_trim: 0.08
