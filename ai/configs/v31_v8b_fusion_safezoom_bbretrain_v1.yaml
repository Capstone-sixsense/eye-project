  saliency_weight: 1.2
  saliency_candidates: 5
  safezoom_max_dim: 1024

infer:
  checkpoint_path: artifacts/runs/10_grounded_classifier/v31_v8b_fusion_safezoom_bbretrain_v1/checkpoints/best.pt
  threshold: 0.05
  use_meta_classifier: true
  evidence_type: lesion_segmentation
  lesion_threshold: 0.5
