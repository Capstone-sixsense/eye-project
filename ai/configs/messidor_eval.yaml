data:
  manifest_path: data/processed/messidor_manifest.csv
  image_root: data/raw
  resize_size: 448
  image_size: 448
  num_workers: 4
  batch_size: 8
  use_preprocessing: true
  test_split: external_test

labels:
  names:
    - normal
    - abnormal

model:
  architecture: efficientnet_b5
  pretrained: false
  num_outputs: 1
  use_attention: true

train:
  device: cuda
  amp: true
  seed: 42

infer:
  device: cuda
  checkpoint_path: artifacts/runs/04_lesion_supervision/v24_multitask/checkpoints/best.pt

