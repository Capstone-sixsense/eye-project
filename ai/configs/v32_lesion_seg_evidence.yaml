project:
  version: v32_lesion_seg_evidence

data:
  seg_mask_mode: per_lesion
  seg_mask_channels: 4

model:
  use_attention: false
  attention_mode: none
  use_aux_seg: true
  aux_seg_block: 4
  aux_seg_channels: 4
  use_gated_pooling: true

train:
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  head_epochs: 0
  finetune_epochs: 15
  backbone_learning_rate: 0.00004
  lambda_aux_seg: 0.5
  seg_loss_type: dice_bce
  pretrained_backbone_path: artifacts/runs/03_resolution_layercam/v7_512_messidor_train/checkpoints/best.pt

infer:
  checkpoint_path: artifacts/runs/07_lesion_evidence/v32_lesion_seg_evidence/checkpoints/best.pt
  threshold: 0.31
  gradcam_method: layercam
  gradcam_target_block: 4
  evidence_type: lesion_segmentation
  lesion_threshold: 0.5
