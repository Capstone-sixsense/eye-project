project:
  version: v27_mil_attention

model:
  use_mil_attention: true

train:
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  head_epochs: 3
  finetune_epochs: 15
  backbone_learning_rate: 0.00004
  pretrained_backbone_path: artifacts/runs/03_resolution_layercam/v7_512_messidor_train/checkpoints/best.pt

infer:
  checkpoint_path: artifacts/runs/04_lesion_supervision/v27_mil_attention/checkpoints/best.pt
  threshold: 0.42
  gradcam_method: layercam
