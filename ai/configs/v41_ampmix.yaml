project:
  version: v41_ampmix

data:
  manifest_path: data/processed/manifest_with_val_mixed.csv
  image_root: data/raw
  train_split: train
  val_split: val_mixed
  external_test_split: external_holdout
  external_calibration_split: external_calibration
  external_holdout_split: external_holdout
  train_exclude_domains: []
  use_fda: true
  fda_probability: 0.7
  ampmix:
    enable: true
    alpha_low: 0.0
    alpha_high: 0.5
  calibration_split:
    source_split: external_test
    calibration_split: external_calibration
    holdout_split: external_holdout
    fraction: 0.2
    seed: 43

model:
  architecture: efficientnet_b5
  use_attention: false
  attention_mode: none
  use_aux_seg: true
  aux_seg_block: 4
  aux_seg_channels: 1
  use_gated_pooling: true
  rsc:
    enable: false

train:
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  head_epochs: 0
  finetune_epochs: 15
  backbone_learning_rate: 0.00004
  lambda_aux_seg: 0.5
  seg_loss_type: dice_bce
  pretrained_backbone_path: artifacts/runs/03_resolution_layercam/v7_512_messidor_train/checkpoints/best.pt
  selection_metric: external_calibration_auroc
  min_checkpoint_sensitivity: 0.0
  keep_last_n_checkpoints: 5
  early_stopping_patience: 8
  use_coral: false

infer:
  checkpoint_path: artifacts/runs/10_grounded_classifier/v41_ampmix/checkpoints/best.pt
  threshold: 0.31
  use_meta_classifier: false
  gradcam_method: layercam
  gradcam_target_block: 4
  evidence_type: cam_research
