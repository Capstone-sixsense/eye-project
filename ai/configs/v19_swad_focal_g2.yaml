project:
  version: v19_swad_focal_g2

data:
  train_exclude_domains: []

model:
  use_mixstyle: false

train:
  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.75
  head_epochs: 0
  finetune_epochs: 15
  backbone_learning_rate: 0.00004
  pretrained_backbone_path: artifacts/checkpoints/v7_messidor_train/best.pt
  swad_last_n_epochs: 5

infer:
  checkpoint_path: artifacts/checkpoints/v19_swad_focal_g2/best.pt
  threshold: 0.5
