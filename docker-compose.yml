services:
  backend:
    build:
      context: ./backend
      dockerfile: backend_Dockerfile
    container_name: eye-backend-service
    ports:
      - "8000:8000"
    volumes:
      # 소스 코드 동기화 (Hot Reload 핵심)
      # 내 컴퓨터의 backend 폴더를 컨테이너의 /app과 연결합니다.
      - ./backend:/app

      # AI 모델 및 프로젝트 루트 데이터 연결
      # PYTHONPATH=/ai 설정을 위해 프로젝트 루트의 ai 폴더를 연결합니다.
      - ./ai:/ai

      # 데이터 저장 영역 (명시적 관리)
      - ./backend/data:/app/data
      - ./backend/storage:/app/storage
      - ./backend/results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
      # CPU 추론 속도 (호스트 코어 수에 맞게 조절)
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
      - TORCH_NUM_THREADS=8
      # CleanVision(Imagelab) 1장도 매우 느림 — 로컬/개발에서만 1 권장. 운영 품질 검사 필요 시 0 또는 제거
      - SKIP_CLEANVISION=0
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend_Dockerfile.dev
    container_name: flutter-web-client
    ports:
      - "8080:80" # 브라우저에서 localhost:8080 접속 가능
    depends_on:
      - backend
    volumes:
      - ./frontend:/app # 소스 동기화
      # 호스트에서 pub get 한 .dart_tool(WSL 절대경로)이 컨테이너와 충돌하므로 분리
      - frontend_dart_tool:/app/.dart_tool
    restart: always

volumes:
  frontend_dart_tool:

networks:
  default:
    name: eye-project-network