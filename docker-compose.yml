services:
  backend:
    # PyTorch 등 바이너리 휠 호환: arm64 호스트(Apple Silicon)에서도 amd64 이미지로 실행.
    # x86_64 Docker 호스트에서는 네이티브 amd64와 동일하게 동작합니다.
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: backend_Dockerfile
    container_name: eye-backend-service
    # 개발용 hot-reload. 프로덕션에서는 이 command 블록을 삭제하면 Dockerfile CMD가 사용됩니다.
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app
      --reload-include "*.py"
      --reload-include "*.yaml"
      --reload-include "*.yml"
      
      --reload-exclude "storage/*"
      --reload-exclude "results/*"
      --reload-exclude "data/*"
      --reload-exclude ".cache/*"
      --reload-exclude "*.log"
    ports:
      - "8000:8000"
    volumes:
      # 소스 코드 동기화 (Hot Reload 핵심)
      # 내 컴퓨터의 backend 폴더를 컨테이너의 /app과 연결합니다.
      - ./backend:/app

      # AI 모델 및 프로젝트 루트 데이터 연결
      # PYTHONPATH=/ai 설정을 위해 프로젝트 루트의 ai 폴더를 연결합니다.
      - ./ai:/ai

      # DenseNet121 pretrained weights 캐시 (Windows symlink checkout 문제 방지)
      - backend-cache:/app/.cache
    environment:
      - PYTHONUNBUFFERED=1
      - FUNDUS_CONFIG_PATH=/ai/configs/base.yaml
      # CPU 추론 속도 — .env 에서 OMP_NUM_THREADS 등을 오버라이드할 수 있습니다
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-8}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-8}
      - TORCH_NUM_THREADS=${TORCH_NUM_THREADS:-8}

      # QuickQual 설정
      - QUICKQUAL_SVM_FILENAME=quickqual_dn121_512.pkl
      - QUICKQUAL_BAD_THRESHOLD=0.7
      - REJECT_BAD_QUALITY=false   # true로 바꾸면 bad 이미지 422로 거부

      - IMAGE_ENCRYPTION_KEY=${IMAGE_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend_Dockerfile
    container_name: eye-frontend-web
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: eye-project-network

volumes:
  backend-cache:
