services:
  backend:
    build:
      context: ./backend
      dockerfile: backend_Dockerfile
    container_name: eye-backend-service
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app
      --reload-include "*.py"
      --reload-include "*.yaml"
      --reload-include "*.yml"
      --reload-exclude "storage/*"
      --reload-exclude "results/*"
      --reload-exclude "data/*"
      --reload-exclude ".cache/*"
      --reload-exclude "*.log"
    ports:
      - "8000:8000"
    volumes:
      # 소스 코드 동기화 (Hot Reload 핵심)
      # 내 컴퓨터의 backend 폴더를 컨테이너의 /app과 연결합니다.
      - ./backend:/app

      # AI 모델 및 프로젝트 루트 데이터 연결
      # PYTHONPATH=/ai 설정을 위해 프로젝트 루트의 ai 폴더를 연결합니다.
      - ./ai:/ai

      # 데이터 저장 영역 (명시적 관리)
      - ./backend/data:/app/data
      - ./backend/storage:/app/storage
      - ./backend/results:/app/results

      # DenseNet121 pretrained weights 캐시 (재시작 시 재다운로드 방지)
      - ./backend/.cache:/app/.cache
    environment:
      - PYTHONUNBUFFERED=1
      - FUNDUS_CONFIG_PATH=/ai/configs/v17_focal_g2.yaml
      # CPU 추론 속도 (호스트 코어 수에 맞게 조절)
      - OMP_NUM_THREADS=8
      - MKL_NUM_THREADS=8
      - TORCH_NUM_THREADS=8

      # QuickQual 설정
      - QUICKQUAL_SVM_FILENAME=quickqual_dn121_512.pkl
      - QUICKQUAL_BAD_THRESHOLD=0.7
      - REJECT_BAD_QUALITY=false   # true로 바꾸면 bad 이미지 422로 거부
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend_Dockerfile
    container_name: eye-frontend-web
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

networks:
  default:
    name: eye-project-network
