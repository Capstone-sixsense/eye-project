services:
  backend:
    build:
      context: ./backend
      dockerfile: backend_Dockerfile
    container_name: eye-backend-service
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/storage:/app/storage
      - ./backend/results:/app/results
      - ./backend:/app
      - ./ai:/ai
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend_Dockerfile
    container_name: flutter-web-client
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: always

networks:
  default:
    name: eye-project-network
